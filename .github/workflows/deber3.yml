name: Deber 3 - TDD y evidencias
on:
  push:
    branches: [deber3]
    paths:
      - '.github/workflows/deber3.yml'
      - '07_Participacion/divisor_cuenta/**'
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: python -m pip install pillow
      - name: Ejecutar etapas y preparar entrega
        run: python 07_Participacion/divisor_cuenta/evidencias/verificar.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deber3-evidencias
          path: 07_Participacion/divisor_cuenta/evidencias/
      - name: Guardar resultados reales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 07_Participacion/divisor_cuenta/evidencias 07_Participacion/divisor_cuenta/respuestas.md
          git diff --cached --quiet || git commit -m 'deber3: resultados verificados y evidencias'
          git push origin HEAD:deber3
